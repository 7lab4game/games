<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>试玩入口 · 7.lab</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", sans-serif;
      background: #101620;
      color: #f1f4f8;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: clamp(20px, 6vw, 72px);
      background: radial-gradient(ellipse at 15% 5%, #21334a 0, transparent 45%), #101620;
    }

    .brand {
      position: absolute;
      top: clamp(18px, 3vw, 30px);
      left: clamp(20px, 6vw, 72px);
      display: inline-flex;
      align-items: baseline;
      color: #f1f4f8;
      font-size: 22px;
      font-weight: 650;
      letter-spacing: -.055em;
      line-height: 1;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    .brand-lab { color: #8797aa; font-weight: 550; }
    .brand:focus-visible { outline: 2px solid #9aafc4; outline-offset: 5px; border-radius: 3px; }

    main {
      width: min(100%, 760px);
      margin: 0 auto;
      padding-top: clamp(46px, 7vw, 66px);
    }

    h1 {
      margin: 0 0 30px;
      font-size: clamp(32px, 7vw, 52px);
      font-weight: 650;
      letter-spacing: -.045em;
      line-height: 1.12;
    }

    nav { display: grid; gap: 16px; }

    .game-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) max-content;
      grid-template-areas:
        "name version"
        "play play"
        "skill skill";
      align-items: center;
      column-gap: 14px;
      row-gap: 8px;
      padding: 17px 20px;
      border: 1px solid #3d4b5c;
      border-radius: 14px;
      background: #192330;
      color: inherit;
      text-decoration: none;
      transition: background-color 140ms ease, border-color 140ms ease, transform 140ms ease;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .game-name {
      grid-area: name;
      min-width: 0;
      color: #f1f4f8;
      font-size: 18px;
      font-weight: 620;
      letter-spacing: -.025em;
      line-height: 1.35;
    }

    .tags {
      display: flex;
      min-width: 0;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tags--play { grid-area: play; }
    .tags--skill { grid-area: skill; }

    .tag {
      padding: 4px 7px;
      border: 1px solid #435267;
      border-radius: 6px;
      color: #9eacbe;
      font-size: 12px;
      font-weight: 450;
      line-height: 1.25;
      white-space: nowrap;
    }

    .tags--skill .tag {
      border-color: transparent;
      background: #263342;
      color: #8999ac;
    }

    .version {
      grid-area: version;
      justify-self: end;
      align-self: center;
      color: #8695a8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.025em;
      white-space: nowrap;
    }

    .game-card:hover {
      border-color: #697d94;
      background: #1d2a39;
      transform: translateY(-1px);
    }

    .game-card:focus-visible {
      outline: 2px solid #9aafc4;
      outline-offset: 3px;
    }

    .game-card:active { transform: scale(.995); }

    @media (max-width: 420px) {
      body { padding-right: 20px; padding-left: 20px; }
      .brand { left: 20px; }
      main { padding-top: 54px; }
      h1 { margin-bottom: 25px; }
      nav { gap: 14px; }
      .game-card { column-gap: 10px; padding: 16px; }
      .game-card { row-gap: 7px; }
      .game-name { font-size: 17px; }
      .tag { padding: 4px 6px; font-size: 11px; }
      .version { font-size: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .game-card { transition: none; }
    }
  </style>
</head>
<body>
  <a class="brand" href="index.html" aria-label="7.lab，返回试玩入口首页"><span>7</span><span class="brand-lab">.lab</span></a>
  <main>
    <h1>试玩入口</h1>
    <nav aria-label="游戏试玩入口">
      <a class="game-card" href="lasser.html">
        <strong class="game-name">Lasser</strong>
        <span class="version">v0.2.1</span>
        <span class="tags tags--play"><span class="tag">激光消除</span><span class="tag">逻辑解谜</span></span>
        <span class="tags tags--skill"><span class="tag">观察</span><span class="tag">顺序推理</span></span>
      </a>
      <a class="game-card" href="1chocolate-0.2.html">
        <strong class="game-name">以巧克力</strong>
        <span class="version">v0.2.10.5</span>
        <span class="tags tags--play"><span class="tag">三消合成</span><span class="tag">叠层策略</span></span>
        <span class="tags tags--skill"><span class="tag">空间判断</span><span class="tag">容量管理</span></span>
      </a>
      <a class="game-card" href="yicheng.html">
        <strong class="game-name">一程</strong>
        <span class="version">v0.6.2.3</span>
        <span class="tags tags--play"><span class="tag">路线规划</span><span class="tag">回合解谜</span></span>
        <span class="tags tags--skill"><span class="tag">全局规划</span><span class="tag">回合计算</span></span>
      </a>
    </nav>
  </main>
</body>
</html>
